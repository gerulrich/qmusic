app.version=${APP_VERSION:unknown}
quarkus.http.auth.form.http-only-cookie=false
quarkus.console.color=true
quarkus.banner.path=banner.txt
quarkus.http.port=8080

# mongodb
quarkus.mongodb.connection-string = mongodb://localhost:27017
quarkus.mongodb.database = example-db

# jackson configuration
quarkus.jackson.serialization-inclusion=non-null

# cors
quarkus.http.cors.enabled=false
%dev.quarkus.http.cors.origins=/.*/

# tdl configuration
auth-api-tdl/mp-rest/url=https://auth.${tld.service}.com
tdl-api/mp-rest/url=https://api.${tld.service}hifi.com
tdl.origin.header=https://listen.${tld.service}.com
tdl.image.url=https://resources.${tld.service}.com/images/%s/%s
tdl.provider.name=The Digital Library
tld.service=qmusic
tdl.country.code=AR

tdl.client.id=
tdl.refresh.token=

# MCP server over HTTP (SSE transport)
quarkus.mcp.server.sse.root-path=/mcp

# jwk authentication
mp.jwt.verify.issuer=quantumlab
%dev.smallrye.jwt.verify.key.location=secret.jwk
%dev.smallrye.jwt.verify.key-format=JWK
%dev.smallrye.jwt.verify.algorithm=HS256

# OpenAPI / Swagger UI
quarkus.smallrye-openapi.info-title=qmusic API
quarkus.smallrye-openapi.info-version=${APP_VERSION:1.0}
quarkus.smallrye-openapi.info-description=Music API
quarkus.smallrye-openapi.info-contact-name=Quantum Lab
quarkus.smallrye-openapi.path=/music/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/music/swagger-ui
